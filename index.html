function panel(title,html){$("#panelContent").innerHTML='<div style="font-size:9px;letter-spacing:2px;color:#f3ce91;font-weight:900">JELAJAH / '+title.toUpperCase()+'</div>'+html;$("#panel").classList.add("open");$("#overlay").classList.add("show")}

function about(){panel("About Jelajah",'<h2>Temukan dunia yang lebih kecil.</h2><p>Jelajah adalah perjalanan melintasi dunia miniatur. Masuki pulau-pulau, temukan landmark, dan nikmati cerita di balik setiap destinasi.</p><div class="fact"><b>10 NEGARA · 50 WILAYAH</b><p>Sepuluh negara dengan lima wilayah pilihan di setiap negara.</p></div><div class="fact"><b>DUNIA YANG HIDUP</b><p>Animasi alam, perubahan waktu, cuaca, dan detail kecil untuk ditemukan.</p></div><div class="fact"><b>KENANGAN LOKAL</b><p>Paspor dan favorit tersimpan di browser tanpa akun.</p></div>')}
